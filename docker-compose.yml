# ============================================================================
# JualinAja — panel admin (Nginx + PHP-FPM + queue worker) & MariaDB
#
# Menjalankan:
#     docker compose up -d --build
#
# Panel      : http://<host>:8888
# phpMyAdmin : http://127.0.0.1:8880  (hanya dari server itu sendiri)
#
# ----------------------------------------------------------------------------
# PENTING — kenapa kredensial database TIDAK memakai nama `DB_*` di sini
# ----------------------------------------------------------------------------
# Docker Compose mengambil nilai untuk ${...} di berkas ini dari berkas `.env`
# di folder ini. Folder ini juga berisi `.env` milik LARAVEL — satu berkas yang
# sama. Jadi menulis `${DB_USERNAME}` di sini berarti Compose membaca kredensial
# MySQL DEVELOPMENT (root, tanpa sandi) untuk membuat database produksi,
# sementara container `app` masuk memakai kredensial dari `.env.docker`.
# Hasilnya: "Access denied for user 'jualinuser'" yang membingungkan.
#
# Karena itu kredensial di bawah memakai nama berciri `JUALINAJA_*` yang tidak
# pernah muncul di `.env` Laravel, sehingga tidak mungkin bertabrakan. Nilai
# bawaan (setelah `:-`) itulah yang berlaku. Untuk mengubahnya tanpa menyunting
# berkas ini, set variabelnya di lingkungan shell sebelum menjalankan compose:
#
#     JUALINAJA_DB_PASSWORD=sandi-baru docker compose up -d
#
# Catatan: `env_file: .env.docker` mengisi pengaturan APLIKASI di dalam
# container (APP_URL, MAIL, MAYAR, dan seterusnya). Isinya TIDAK dipakai untuk
# interpolasi ${...} di sini.
#
# Kredensial MariaDB hanya diterapkan saat inisialisasi PERTAMA volume
# `db_data`. Kalau Anda mengubahnya setelah database pernah dibuat, hapus
# volumenya dulu — kalau tidak, database tetap memakai sandi lama:
#
#     docker compose down
#     docker volume rm jualinaja_db_data
#     docker compose up -d --build
# ============================================================================

services:
  # ==========================================================================
  # Aplikasi: Nginx + PHP-FPM + queue worker (satu container, via Supervisor)
  # ==========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "8.4"
    container_name: jualinaja_app
    restart: unless-stopped
    ports:
      - "${JUALINAJA_WEB_PORT:-8888}:80"
    env_file:
      - .env.docker
    environment:
      # Nilainya HARUS sama dengan milik servis `db` di bawah. Keduanya membaca
      # variabel yang sama, jadi cukup diubah di satu tempat (lihat catatan di
      # kepala berkas).
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${JUALINAJA_DB_NAME:-jualinaja}
      DB_USERNAME: ${JUALINAJA_DB_USER:-jualinuser}
      DB_PASSWORD: ${JUALINAJA_DB_PASSWORD:-secretpassword}
    volumes:
      - ./storage/app:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
      # Cover & PDF Pustaka ditulis ke `public/uploads` (lihat
      # `config/filesystems.php`). Tanpa volume ini, seluruh berkas unggahan
      # hilang setiap container dibangun ulang.
      - uploads:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jualinaja_network

  # ==========================================================================
  # Basis data: MariaDB (kompatibel penuh MySQL, hemat RAM)
  # ==========================================================================
  db:
    image: mariadb:10.11
    container_name: jualinaja_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${JUALINAJA_DB_NAME:-jualinaja}
      MYSQL_USER: ${JUALINAJA_DB_USER:-jualinuser}
      MYSQL_PASSWORD: ${JUALINAJA_DB_PASSWORD:-secretpassword}
      MYSQL_ROOT_PASSWORD: ${JUALINAJA_DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${JUALINAJA_DB_PORT:-33066}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # Dipakai `depends_on: service_healthy`. Tanpa ini container `app` bisa
      # naik sebelum MariaDB siap menerima koneksi.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - jualinaja_network

  # ==========================================================================
  # phpMyAdmin — sengaja hanya di 127.0.0.1
  # ==========================================================================
  # Panel ini memegang seluruh basis data, jadi ia tidak dibuka ke internet.
  # Untuk mengaksesnya dari komputer Anda, buat terowongan SSH:
  #
  #     ssh -L 8880:127.0.0.1:8880 user@server
  #
  # lalu buka http://127.0.0.1:8880 dan masuk memakai kredensial database.
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: jualinaja_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JUALINAJA_PHPMYADMIN_PORT:-8880}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      # Menyamai batas unggah nginx & PHP (64M) supaya impor dump tidak gagal.
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jualinaja_network

networks:
  jualinaja_network:
    driver: bridge

volumes:
  db_data:
    # Volume ini yang dihapus kalau ingin database benar-benar mulai dari nol.
    name: jualinaja_db_data
    driver: local
  uploads:
    name: jualinaja_uploads
    driver: local
