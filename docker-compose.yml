version: '3.8'

services:
  # ============================================================================
  # Aplikasi Web Laravel + React (Nginx + PHP-FPM)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "8.4"
    container_name: jualinaja_app
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8888}:80"
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - ./storage/app:/var/www/html/storage/app
      - ./storage/logs:/var/www/html/storage/logs
    depends_on:
      - db
    networks:
      - jualinaja_network

  # ============================================================================
  # Basis Data MySQL 8.0
  # ============================================================================
  db:
    image: mysql:8.0
    container_name: jualinaja_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=128M --max-connections=50
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-jualinaja}
      MYSQL_USER: ${DB_USERNAME:-jualinuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secretpassword}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${DB_PORT_HOST:-33066}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - jualinaja_network

networks:
  jualinaja_network:
    driver: bridge

volumes:
  db_data:
    driver: local
